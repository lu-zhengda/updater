SPECIFICATION Spec
CONSTANTS
  Helpers = {h1, h2}
  Mode = "brew"
  BrewFault = "none"
  TwoRename = FALSE
  SkipChecksum = FALSE
  SkipSignature = FALSE
  SkipNewer = FALSE
  SkipRelock = FALSE
  SkipLock = FALSE
  SkipVersionMatch = FALSE
  SkipCaskVersion = FALSE
  SkipRecovery = FALSE
INVARIANT AlwaysPresent
INVARIANT NoDowngrade
INVARIANT NoBadInstall
INVARIANT MutualExclusion
INVARIANT LockSpansBrew
