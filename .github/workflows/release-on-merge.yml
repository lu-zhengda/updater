name: Release on merge

# Labels are on the pull request. A push to main with no merged pull request
# does not run this workflow and does not publish.
# GITHUB_TOKEN cannot start release.yml by pushing the tag, so this workflow
# calls the publish job after the tag exists.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

# Same group as release.yml. queue: max keeps later runs waiting.
# actionlint 1.7.12 does not know this key yet.
concurrency:
  group: updater-release
  queue: max

jobs:
  plan:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Require the merge commit
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if [ -z "$MERGE_SHA" ]; then
            echo "merged pull request has no merge commit; refusing to publish"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Choose the semver bump and tag the merge commit
        id: plan
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: sh scripts/plan-release-tag.sh

  release:
    needs: plan
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      expected_sha: ${{ github.event.pull_request.merge_commit_sha }}
    secrets:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
