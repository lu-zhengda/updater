name: Bootstrap semver labels

# One-shot for the branch that adds release-on-merge. The agent token cannot
# create labels (the labels API requires issues:write). Removed after it runs.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  labels:
    if: >-
      github.head_ref == 'zhengda-lu/semver-release-on-merge-5610' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create semver labels and mark PR 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          gh label create "semver:patch" --repo "$repo" --color 0E8A16 --description "On merge to main, publish a patch bump of the latest vX.Y.Z tag." --force
          gh label create "semver:minor" --repo "$repo" --color 1D76DB --description "On merge to main, publish a minor bump of the latest vX.Y.Z tag." --force
          gh label create "semver:major" --repo "$repo" --color B60205 --description "On merge to main, publish a major bump of the latest vX.Y.Z tag." --force
          gh pr edit 25 --repo "$repo" --add-label "semver:minor"
