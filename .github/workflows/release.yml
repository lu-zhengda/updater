name: Release

# Pushed v* tags. Branch pushes do not run this file.
# A tag created with GITHUB_TOKEN does not start this workflow. The merge
# workflow calls the publish job itself for that reason.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Shared with release-on-merge.yml so a tag push and a merge publish do not
# sign at the same time. queue: max keeps later runs waiting instead of
# cancelling them. actionlint 1.7.12 does not know this key yet.
concurrency:
  group: updater-release
  queue: max

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ github.ref_name }}
      expected_sha: ${{ github.sha }}
    secrets:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
      APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
