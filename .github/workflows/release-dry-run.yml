name: Release dry-run

# Temporary publish-free dry-run. Delete this workflow after the signed
# tarball has been checked on a Mac. workflow_dispatch is the only trigger:
# there is no push, pull_request, or tag event.
#
# GoReleaser v2.20.1 `release` requires HEAD to be the current tag.
# `goreleaser release --help` describes the alternative:
#   --snapshot  Generate an unversioned snapshot release, skipping all
#               validations and without publishing any artifacts
#               (implies --skip=announce,publish,validate)
# The command is:
#   release --clean --snapshot --skip=publish --skip=homebrew
#
# workflow_dispatch on main is not a tag, so --snapshot is required.
# require-main fails unless GITHUB_REF is refs/heads/main, and that job
# finishes before this one enters the release environment. A non-main
# dispatch therefore does not request approval and does not receive
# environment secrets. The signing job checks the ref again before it
# reads the certificate.
#
# --snapshot skips the publishing pipe (GitHub Releases and cask pushes)
# and the release preflight token check. --skip=homebrew is also set: the
# cask pipe skips only on that flag, and its Run() would otherwise write a
# cask and template HOMEBREW_TAP_TOKEN. This job does not set that token
# and does not set GITHUB_TOKEN. contents: read cannot create a release.
# Signing secrets come from the release environment, after its required
# reviewer approves the deployment.
#
# Universal-binary post hooks still run (scripts/mkapp.sh, then
# scripts/notarize-app.sh). Those hooks are not the `notarize` skip, and
# `release` has no post-hooks skip. .goreleaser.yaml has no notarize block,
# so GoReleaser's own notarize pipe does not run.
#
# v2.20.1 default snapshot version (not overridden in .goreleaser.yaml):
#   {{ .Version }}-SNAPSHOT-{{ .ShortCommit }}
# Archive name_template:
#   {{ .ProjectName }}_{{ .Version }}_darwin
# Artifact:
#   dist/updater_<tag-without-v>-SNAPSHOT-<short>_darwin.tar.gz
# On this branch, git describe --tags --abbrev=0 is v0.23.0, so a run here
# produces updater_0.23.0-SNAPSHOT-<short>_darwin.tar.gz. <short> is
# `git show -s --format=%h` of the commit that was checked out. The stapled
# bundle is dist/Updater.app. Verify the tarball from the Actions artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  require-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require refs/heads/main
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "dry-run requires GITHUB_REF=refs/heads/main"
            printf 'GITHUB_REF=%s\n' "$GITHUB_REF"
            exit 1
          fi

  release-dry-run:
    needs: require-main
    # GitHub Environment "release". Required reviewer and deployment branches
    # (main and v* tags) are set in GitHub settings, not in this file.
    environment: release
    # GitHub-hosted image. Do not point this at a self-hosted runner.
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "1"
      MACOS_SIGNING_IDENTITY: "Developer ID Application: Zhengda Lu (XY7H3QGJ2T)"
      NOTARIZE: "1"
    steps:
      - name: Require refs/heads/main
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "dry-run requires GITHUB_REF=refs/heads/main"
            printf 'GITHUB_REF=%s\n' "$GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Import Developer ID certificate
        env:
          MACOS_KEYCHAIN_PATH: ${{ runner.temp }}/updater-signing.keychain-db
          DEVELOPER_ID_P12_PATH: ${{ runner.temp }}/updater-developer-id.p12
          APPSTORE_API_KEY_PATH: ${{ runner.temp }}/updater-authkey.p8
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPSTORE_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077

          require_nonempty() {
            if [ -z "$2" ]; then
              echo "$1 is empty"
              exit 1
            fi
          }
          require_nonempty MACOS_CERT_P12_BASE64 "$MACOS_CERT_P12_BASE64"
          require_nonempty MACOS_CERT_PASSWORD "$MACOS_CERT_PASSWORD"
          require_nonempty APPSTORE_API_KEY_P8_BASE64 "$APPSTORE_API_KEY_P8_BASE64"
          require_nonempty APPSTORE_API_KEY_ID "$APPSTORE_API_KEY_ID"
          require_nonempty APPSTORE_API_ISSUER_ID "$APPSTORE_API_ISSUER_ID"

          # Workflow commands treat % as an escape. Mask the value GitHub has not
          # already redacted (a trimmed password, or the generated keychain password).
          add_mask() {
            escaped="$1"
            escaped="${escaped//%/%25}"
            escaped="${escaped//$'\r'/%0D}"
            escaped="${escaped//$'\n'/%0A}"
            echo "::add-mask::${escaped}"
          }

          # Drop a trailing newline from a secret file without printing it.
          MACOS_CERT_PASSWORD="$(printf '%s' "$MACOS_CERT_PASSWORD")"
          add_mask "$MACOS_CERT_PASSWORD"

          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          if [ "${#KEYCHAIN_PASSWORD}" -ne 64 ]; then
            echo "failed to generate a keychain password"
            exit 1
          fi
          add_mask "$KEYCHAIN_PASSWORD"

          rm_p12() {
            rm -f "$DEVELOPER_ID_P12_PATH"
          }
          trap rm_p12 EXIT

          # `openssl enc` is the flag set both LibreSSL (GitHub's macOS image) and OpenSSL accept.
          printf '%s' "$MACOS_CERT_P12_BASE64" | tr -d '[:space:]' | openssl enc -d -base64 -A -out "$DEVELOPER_ID_P12_PATH"
          printf '%s' "$APPSTORE_API_KEY_P8_BASE64" | tr -d '[:space:]' | openssl enc -d -base64 -A -out "$APPSTORE_API_KEY_PATH"
          chmod 600 "$DEVELOPER_ID_P12_PATH" "$APPSTORE_API_KEY_PATH"

          if [ ! -s "$DEVELOPER_ID_P12_PATH" ]; then
            echo "MACOS_CERT_P12_BASE64 decoded to an empty file"
            exit 1
          fi
          if ! grep -q -- "-----BEGIN PRIVATE KEY-----" "$APPSTORE_API_KEY_PATH"; then
            echo "APPSTORE_API_KEY_P8_BASE64 did not decode to a PKCS#8 PEM private key"
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$MACOS_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$MACOS_KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$MACOS_KEYCHAIN_PATH"
          security import "$DEVELOPER_ID_P12_PATH" \
            -k "$MACOS_KEYCHAIN_PATH" \
            -P "$MACOS_CERT_PASSWORD" \
            -f pkcs12 \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$MACOS_KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$MACOS_KEYCHAIN_PATH"
          security default-keychain -s "$MACOS_KEYCHAIN_PATH"

          identities="$(security find-identity -p codesigning -v "$MACOS_KEYCHAIN_PATH")"
          printf '%s\n' "$identities"
          if ! printf '%s\n' "$identities" | grep -F "$MACOS_SIGNING_IDENTITY" >/dev/null; then
            echo "codesigning identity not found in the temporary keychain"
            exit 1
          fi

      - name: Snapshot release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.1
          args: release --clean --snapshot --skip=publish --skip=homebrew
        env:
          MACOS_KEYCHAIN_PATH: ${{ runner.temp }}/updater-signing.keychain-db
          APPSTORE_API_KEY_PATH: ${{ runner.temp }}/updater-authkey.p8
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}

      - name: Check dry-run artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(dist/updater_*_darwin.tar.gz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "expected exactly one dist/updater_*_darwin.tar.gz, found ${#tarballs[@]}"
            ls -la dist
            exit 1
          fi
          tarball="${tarballs[0]}"
          if [ -d dist/homebrew ]; then
            echo "dist/homebrew exists; the dry-run prepared a cask"
            exit 1
          fi
          if ! tar -tzf "$tarball" | grep -F 'Updater.app/Contents/MacOS/updater' >/dev/null; then
            echo "tarball is missing Updater.app/Contents/MacOS/updater"
            tar -tzf "$tarball"
            exit 1
          fi
          if [ ! -d dist/Updater.app/Contents/MacOS ]; then
            echo "dist/Updater.app is missing"
            exit 1
          fi
          if find dist \( -name '*.p12' -o -name '*.p8' -o -name '*.keychain-db' -o -name '*keychain*' \) -print | grep -q .; then
            echo "refusing to upload: signing material is under dist"
            exit 1
          fi
          echo "Dry-run tarball: ${tarball}"
          echo "Stapled app: dist/Updater.app"
          {
            echo "Dry-run tarball: ${tarball}"
            echo
            echo "Download the updater-darwin-dry-run artifact and verify the .tar.gz. Leave quarantine on."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload signed darwin dry-run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: updater-darwin-dry-run
          if-no-files-found: error
          path: |
            dist/updater_*_darwin.tar.gz
            dist/Updater.app

      - name: Delete temporary keychain and API key
        if: always()
        env:
          MACOS_KEYCHAIN_PATH: ${{ runner.temp }}/updater-signing.keychain-db
          DEVELOPER_ID_P12_PATH: ${{ runner.temp }}/updater-developer-id.p12
          APPSTORE_API_KEY_PATH: ${{ runner.temp }}/updater-authkey.p8
        run: |
          set -euo pipefail
          if [ -n "${MACOS_KEYCHAIN_PATH:-}" ] && [ -f "$MACOS_KEYCHAIN_PATH" ]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH"
          fi
          rm -f "${DEVELOPER_ID_P12_PATH:-}" "${APPSTORE_API_KEY_PATH:-}"
          if [ -f "${MACOS_KEYCHAIN_PATH:-/nonexistent}" ] || [ -f "${DEVELOPER_ID_P12_PATH:-/nonexistent}" ] || [ -f "${APPSTORE_API_KEY_PATH:-/nonexistent}" ]; then
            echo "signing material still present after cleanup"
            exit 1
          fi
