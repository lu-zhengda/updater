version: 2

builds:
  - id: updater
    main: ./cmd/updater
    binary: updater
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
  - id: updater-menubar
    main: ./cmd/updater-menubar
    binary: updater-menubar
    goos:
      - darwin
    goarch:
      - arm64
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -w

universal_binaries:
  - id: updater
    replace: true

archives:
  - id: updater-archive
    builds:
      - updater
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}"
    files:
      - completions/*
  - id: menubar-archive
    builds:
      - updater-menubar
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}-menubar_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: []

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - repository:
      owner: lu-zhengda
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/lu-zhengda/updater"
    description: "macOS app update manager"
    license: "MIT"
    ids:
      - updater-archive
    binaries:
      - updater
    completions:
      bash: completions/updater.bash
      zsh: completions/updater.zsh
      fish: completions/updater.fish
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/updater"]
          end
