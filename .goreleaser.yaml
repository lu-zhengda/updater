version: 2

builds:
  - id: updater
    main: ./cmd/updater
    binary: updater
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      # The menu bar app (updater menubar run) uses systray, which needs cgo.
      - CGO_ENABLED=1
      - CGO_CFLAGS=-O2 -g -mmacosx-version-min=26.0
      - CGO_CXXFLAGS=-O2 -g -mmacosx-version-min=26.0
      - CGO_LDFLAGS=-O2 -g -mmacosx-version-min=26.0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

universal_binaries:
  - id: updater
    replace: true
    hooks:
      post:
        # Both hooks run in this pipe, which GoReleaser finishes before it
        # builds archives. The tarball (and the cask checksum of that tarball)
        # therefore contains the signed, stapled app.
        #
        # mkapp.sh signs the Mach-O and the bundle when MACOS_SIGNING_IDENTITY
        # is set. notarize-app.sh submits, staples, and validates only when
        # NOTARIZE=1. The release workflow sets both.
        - sh scripts/mkapp.sh "{{ .Path }}" "{{ .Version }}" dist
        - sh scripts/notarize-app.sh dist/Updater.app

archives:
  - id: updater-archive
    ids:
      - updater
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_darwin"
    files:
      - completions/*
      # The glob strips the matched files' common prefix (dist/Updater.app/
      # Contents/), so dst must restore the Contents level.
      - src: dist/Updater.app/**
        dst: Updater.app/Contents

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - repository:
      owner: lu-zhengda
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/lu-zhengda/updater"
    description: "macOS app update manager"
    license: "MIT"
    ids:
      - updater-archive
    dependencies:
      - formula: mas
    completions:
      bash: completions/updater.bash
      zsh: completions/updater.zsh
      fish: completions/updater.fish
    # Use the executable inside the stapled app for CLI/TUI launches too.
    # A quarantined standalone Mach-O cannot carry the app's stapled ticket.
    binaries:
      - "#{appdir}/Updater.app/Contents/MacOS/updater"
    custom_block: |
      depends_on macos: :tahoe
      app "Updater.app"
    hooks:
      pre:
        install_steps: |
          on_macos do
            # Replace a manually-placed copy (e.g. from the release tarball);
            # Homebrew refuses to overwrite an app it did not install.
            remove "Updater.app", base: :appdir, recursive: true
          end
