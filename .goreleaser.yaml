version: 2

builds:
  - id: updater
    main: ./cmd/updater
    binary: updater
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      # The menu bar app (updater menubar run) uses systray, which needs cgo.
      - CGO_ENABLED=1
      - CGO_CFLAGS=-O2 -g -mmacosx-version-min=26.0
      - CGO_CXXFLAGS=-O2 -g -mmacosx-version-min=26.0
      - CGO_LDFLAGS=-O2 -g -mmacosx-version-min=26.0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

universal_binaries:
  - id: updater
    replace: true
    hooks:
      post:
        # These hooks run in this pipe, which GoReleaser finishes before it
        # builds archives or checksums. The tarball (and the cask checksum of
        # that tarball) therefore contains the signed, stapled app. mkdmg.sh
        # then builds dist/Updater-<version>.dmg from that same app, so the
        # checksum and the uploaded image are the signed, stapled DMG.
        #
        # mkapp.sh signs the Mach-O and the bundle when MACOS_SIGNING_IDENTITY
        # is set. notarize-app.sh and mkdmg.sh submit, staple, and validate
        # only when NOTARIZE=1. The release workflow sets both.
        #
        # Open-source GoReleaser v2.20.1 has no DMG pipe. The dmg section in
        # current docs is Pro-only and does not package this already stapled
        # bundle. The filename below is the release asset name.
        - sh scripts/mkapp.sh "{{ .Path }}" "{{ .Version }}" dist
        - sh scripts/notarize-app.sh dist/Updater.app
        - sh scripts/mkdmg.sh dist/Updater.app "{{ .Version }}" dist

archives:
  - id: updater-archive
    ids:
      - updater
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_darwin"
    files:
      - completions/*
      # The glob strips the matched files' common prefix (dist/Updater.app/
      # Contents/), so dst must restore the Contents level.
      - src: dist/Updater.app/**
        dst: Updater.app/Contents

checksum:
  name_template: "checksums.txt"
  extra_files:
    # Same path mkdmg.sh writes. Checksums only; the cask still hashes the
    # tarball selected by updater-archive.
    - glob: ./dist/Updater-{{ .Version }}.dmg

# Uploads the DMG next to the tarball and checksums.txt. The file is not an
# archive, so homebrew_casks below keeps its updater-archive URL.
release:
  extra_files:
    - glob: ./dist/Updater-{{ .Version }}.dmg

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - repository:
      owner: lu-zhengda
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/lu-zhengda/updater"
    description: "macOS app update manager"
    license: "MIT"
    ids:
      - updater-archive
    dependencies:
      - formula: mas
    completions:
      bash: completions/updater.bash
      zsh: completions/updater.zsh
      fish: completions/updater.fish
    # Use the executable inside the stapled app for CLI/TUI launches too.
    # A quarantined standalone Mach-O cannot carry the app's stapled ticket.
    binaries:
      - "#{appdir}/Updater.app/Contents/MacOS/updater"
    # GoReleaser v2.20.1 writes `depends_on :macos` for every macOS-only
    # cask and has no field for a version. A second `depends_on macos:`
    # stanza makes current Homebrew refuse to load the cask. This method
    # is inside the cask and turns that bare call into macOS 26 (Tahoe).
    custom_block: |
      def depends_on(arg = nil, **kwargs)
        if arg == :macos && kwargs.empty?
          super(macos: :tahoe)
        else
          super
        end
      end
      app "Updater.app"
    hooks:
      pre:
        install_steps: |
          on_macos do
            # Replace a manually-placed copy (e.g. from the release tarball);
            # Homebrew refuses to overwrite an app it did not install.
            remove "Updater.app", base: :appdir, recursive: true
          end
