version: 2

builds:
  - id: updater
    main: ./cmd/updater
    binary: updater
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      # The menu bar app (updater menubar run) uses systray, which needs cgo.
      - CGO_ENABLED=1
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

universal_binaries:
  - id: updater
    replace: true
    hooks:
      post:
        # Assemble Updater.app around the universal binary; archived below.
        - sh scripts/mkapp.sh "{{ .Path }}" "{{ .Version }}" dist

archives:
  - id: updater-archive
    ids:
      - updater
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_darwin"
    files:
      - completions/*
      # The glob strips the matched files' common prefix (dist/Updater.app/
      # Contents/), so dst must restore the Contents level.
      - src: dist/Updater.app/**
        dst: Updater.app/Contents

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - repository:
      owner: lu-zhengda
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/lu-zhengda/updater"
    description: "macOS app update manager"
    license: "MIT"
    ids:
      - updater-archive
    dependencies:
      - formula: mas
    completions:
      bash: completions/updater.bash
      zsh: completions/updater.zsh
      fish: completions/updater.fish
    # Install Updater.app as the app. The archive's root binary is linked onto
    # PATH automatically (goreleaser emits `binary "updater"`), so the CLI/TUI
    # keeps working standalone.
    custom_block: |
      app "Updater.app"
    hooks:
      pre:
        install: |
          if OS.mac?
            # Replace a manually-placed copy (e.g. from the release tarball);
            # Homebrew refuses to overwrite an app it did not install.
            system_command "/bin/rm", args: ["-rf", "#{appdir}/Updater.app"], sudo: false
          end
      post:
        install: |
          if OS.mac?
            # Dequarantine the app AND the staged CLI binary — Gatekeeper
            # kills the unsigned quarantined binary on first run otherwise.
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{appdir}/Updater.app"], sudo: false
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/updater"], sudo: false
            system_command "/usr/bin/open", args: ["#{appdir}/Updater.app"], sudo: false
          end
